---
layout: default
---

<div class="posts">
  {% assign arabic_posts = site.posts | where_exp: "post", "post.lang != 'en'" %}
  {% for post in arabic_posts %}
    <article class="post">
      <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">اكمل القراءة</a>
    </article>
  {% endfor %}
</div>
