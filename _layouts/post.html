---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  {% if page.date %}
    <div class="date">
      {% if page.lang == "en" %}
        Written on {{ page.date | date: "%B %d, %Y" }}
      {% else %}
        كُتب في {{ page.date | date: "%d/%m/%Y" }}
      {% endif %}
    </div>
  {% endif %}

  {% include disqus.html %}
</article>
